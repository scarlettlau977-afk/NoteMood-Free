<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>微光 · 感受记录</title><link rel="stylesheet" href="style.css"></head><body><main class="page-shell"><header><a class="brand" href="#top">微光 <span>·</span> Feelings</a><button class="settings-link" id="openSettings">GitHub 同步设置</button></header><section class="hero" id="top"><p class="eyebrow">给此刻一点空间</p><h1>你的感受，<br><em>值得被轻轻听见。</em></h1><p class="intro">不必把一切整理好再说。写下一点点，留给自己，也可以匿名分享给正在经历相似时刻的人。</p></section><section class="composer"><div class="section-heading"><div><p class="eyebrow">今天的记录</p><h2>现在的你，感觉如何？</h2></div><time id="today"></time></div><div class="mood-picker"><button class="mood active" data-mood="疲惫" data-icon="😮‍💨">😮‍💨 疲惫</button><button class="mood" data-mood="难过" data-icon="😔">😔 难过</button><button class="mood" data-mood="焦虑" data-icon="😟">😟 焦虑</button><button class="mood" data-mood="平静" data-icon="😌">😌 平静</button><button class="mood" data-mood="开心" data-icon="🙂">🙂 开心</button></div><textarea id="feeling" maxlength="280" placeholder="发生了什么？或者，只是此刻心里有什么……"></textarea><div class="composer-foot"><label class="share-toggle"><input id="sharePublic" type="checkbox" checked><span></span>匿名分享至感受墙</label><div><span class="counter"><b id="count">0</b>/280</span><button class="primary" id="saveFeeling">保存这一刻</button></div></div><p class="notice" id="notice"></p></section><section class="wall"><div class="section-heading"><div><p class="eyebrow">我们并不孤单</p><h2>匿名感受墙</h2></div><button class="refresh" id="syncWall">↻ 同步 GitHub</button></div><p class="wall-intro">这里没有名字，只有正在努力生活的人。</p><div class="cards" id="feelingWall"></div><p class="empty" id="emptyState">还没有公开记录。第一句温柔的话，可以从你开始。</p></section></main><dialog id="settingsDialog"><form method="dialog" class="settings-card"><button class="close" value="cancel">×</button><p class="eyebrow">可选功能</p><h2>连接 GitHub 仓库</h2><p class="dialog-copy">公开记录将保存到仓库中的 JSON 文件，其他使用者同步后就能看到。令牌只在本次浏览器会话中使用。</p><label>仓库（用户名/仓库名）<input id="repo" placeholder="your-name/feelings-wall"></label><label>分支<input id="branch" value="main"></label><label>文件路径<input id="filePath" value="data/feelings.json"></label><label>GitHub Personal Access Token<input id="token" type="password" placeholder="github_pat_..."></label><p class="token-help">令牌需有该仓库的 Contents 读写权限。请勿把令牌提交到 GitHub。</p><div class="dialog-actions"><button class="secondary" value="cancel">取消</button><button class="primary" id="saveSettings" value="default">保存设置</button></div></form></dialog><script src="app.js"></script></body></html>
